services:
  # 1. Base de données PostgreSQL
  db:
    image: postgres:latest
    container_name: medpredict_db
    environment:
      POSTGRES_DB: medpredict_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  # 2. Backend Django
  backend:
    build: ./backend
    container_name: medpredict_backend
    volumes:
      - ./backend:/app
      - /etc/localtime:/etc/localtime:ro  # ✅ Fusionné en une seule section
    ports:
      - "8000:8000"
    env_file:
      - .env 
    environment:
      - DATABASE_NAME=medpredict_db
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=password123
      - DATABASE_HOST=db
      - TZ=Africa/Casablanca
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery:
    build: ./backend
    env_file:
      - .env 
    command: celery -A config worker -l info
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - backend
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - TZ=Africa/Casablanca
    volumes:
      - ./backend:/app
      - /etc/localtime:/etc/localtime:ro

  teleconsult:
    build: ./teleconsult
    container_name: medpredict_teleconsult
    ports:
      - "5000:5000"
    volumes:
      - ./teleconsult:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - FLASK_ENV=development
      - TZ=Africa/Casablanca
    command: python app.py

  # 3. IA Service (Microservice ML/AI)
  ia-service:
    build: ./ia-service
    container_name: medpredict_ia_service
    ports:
      - "5001:5001"
    volumes:
      - ./ia-service:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - FLASK_ENV=development
      - TZ=Africa/Casablanca
    command: python run.py --host 0.0.0.0 --port 5001


  # 3. Frontend React (Vite)
  frontend:
    build: ./frontend
    container_name: medpredict_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
      - teleconsult

volumes:
  postgres_data: